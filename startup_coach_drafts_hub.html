        let currentFiles = {};

        function updateFilesWithDomain(domainText) {
            currentFiles = {};
            for (let [k, template] of Object.entries(baseFiles)) {
                let replaced = template.replace(/{DOMAIN_TITLE}/g, domainText);
                currentFiles[k] = replaced;
            }
        }

        // Initialize with default domain
        updateFilesWithDomain(currentDomainName);

        function renderPresets(filter = 'all') {
            const grid = document.getElementById('presets-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? domainPresets : domainPresets.filter(p => p.cat === filter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "p-3 border border-slate-200 rounded-xl hover:border-brand-500 hover:bg-indigo-50/30 transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => {
                    document.getElementById('custom-domain-input').value = p.title;
                };
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-xs mb-0.5">${p.title}</div>
                        <div class="text-slate-500 text-[11px]">${p.desc}</div>
                    </div>
                    <div class="mt-2 text-[10px] text-brand-600 font-semibold flex items-center space-x-1">
                        <span>선택하기</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPresets(cat) {
            ['all', 'ai', 'lifestyle', 'creator', 'indie'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                if (c === cat) {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-brand-600 text-white transition";
                } else {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                }
            });
            renderPresets(cat);
        }

        function renderNav() {
            const nav = document.getElementById('step-nav');
            nav.innerHTML = '';
            
            const fileKeys = Object.keys(currentFiles);
            fileKeys.forEach((key, index) => {
                const titleMap = {
                    '1_2.md': '1. 코치 세팅 (초안 1)',
                    '2_2.md': '2. 코치 세팅 (초안 2)',
                    '3_2.md': '3. 고객가설 및 사업기회',
                    '4_2.md': '4. 사업계획서 초안 요구사항',
                    '5_2.md': '5. 3단계 사업계획서 초안',
                    '6_2.md': '6. 4-1단계 Mini PRD',
                    '7_2.md': '7. 4-2단계 Mock MVP PRD'
                };

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium transition flex items-center justify-between group ${activeFileKey === key ? 'bg-indigo-50 text-brand-700 font-semibold shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`;
                btn.innerHTML = `
                    <span class="truncate">${titleMap[key] || key}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200/60 text-slate-500 group-hover:bg-slate-200">${key}</span>
                `;
                btn.onclick = () => selectFile(key);
                nav.appendChild(btn);
            });

            const activeIdx = fileKeys.indexOf(activeFileKey) + 1;
            document.getElementById('active-step-badge').textContent = `${activeIdx}/7 단계`;
        }

        function selectFile(key) {
            if (isEditing) {
                saveCurrentEdit();
            }
            activeFileKey = key;
            renderNav();
            updateDocView();
        }

        function updateDocView() {
            document.getElementById('doc-badge').textContent = activeFileKey;
            
            const titleMap = {
                '1_2.md': '스타트업 코치 역할 및 진행 원칙 (1)',
                '2_2.md': '스타트업 코치 역할 및 진행 원칙 (2)',
                '3_2.md': '2단계: 고객가설 및 사업기회 분석 결과',
                '4_2.md': '3단계 사업계획서 작성 요청서',
                '5_2.md': '3단계 사업계획서 초안 결과물',
                '6_2.md': '4-1단계: MVP 정의 및 Mini PRD',
                '7_2.md': '4-2단계: Claude Code Mock MVP 개발 PRD'
            };

            document.getElementById('doc-title').textContent = titleMap[activeFileKey] || activeFileKey;
            
            const content = currentFiles[activeFileKey];
            document.getElementById('viewer-pane').textContent = content;
            document.getElementById('editor-pane').value = content;
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            const viewer = document.getElementById('viewer-pane');
            const editor = document.getElementById('editor-pane');
            const btn = document.getElementById('edit-mode-btn');

            if (isEditing) {
                viewer.classList.add('hidden');
                editor.classList.remove('hidden');
                btn.textContent = '저장하기';
                btn.classList.remove('bg-brand-600', 'hover:bg-brand-700');
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            } else {
                currentFiles[activeFileKey] = editor.value;
                editor.classList.add('hidden');
                viewer.classList.remove('hidden');
                btn.textContent = '편집하기';
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                btn.classList.add('bg-brand-600', 'hover:bg-brand-700');
                updateDocView();
                showToast('변경사항이 저장되었습니다.');
            }
        }

        function saveCurrentEdit() {
            if (isEditing) {
                currentFiles[activeFileKey] = document.getElementById('editor-pane').value;
                isEditing = false;
                document.getElementById('editor-pane').classList.add('hidden');
                document.getElementById('viewer-pane').classList.remove('hidden');
                const btn = document.getElementById('edit-mode-btn');
                btn.textContent = '편집하기';
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-brand-600');
            }
        }

        function copyCurrentContent() {
            saveCurrentEdit();
            const text = currentFiles[activeFileKey];
            document.execCommand ? copyLegacy(text) : navigator.clipboard.writeText(text);
            showToast('현재 문서 내용이 복사되었습니다.');
        }

        function copyLegacy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function downloadCurrentFile() {
            saveCurrentEdit();
            const text = currentFiles[activeFileKey];
            const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = activeFileKey;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`${activeFileKey} 파일이 다운로드되었습니다.`);
        }

        function downloadAllMarkdown() {
            saveCurrentEdit();
            let combined = "# 전체 초안 및 단계별 문서 모음 (Domain: " + currentDomainName + ")\n\n";
            for (const [k, v] of Object.entries(currentFiles)) {
                combined += `\n\n---\n\n## File: ${k}\n\n` + v;
            }
            const blob = new Blob([combined], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all_drafts_download.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('통합본(all_drafts_download.md)이 다운로드되었습니다.');
        }

        function openDomainModal() {
            document.getElementById('domain-modal').classList.remove('hidden');
        }

        function closeDomainModal() {
            document.getElementById('domain-modal').classList.add('hidden');
        }

        function applySelectedDomain() {
            const val = document.getElementById('custom-domain-input').value.trim();
            if (val) {
                currentDomainName = val;
                document.getElementById('current-domain-label').textContent = currentDomainName;
                updateFilesWithDomain(currentDomainName);
                updateDocView();
                showToast(`모든 초안이 [${currentDomainName}] 도메인에 맞게 재생성되었습니다.`);
            }
            closeDomainModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 3000);
        }

        // Initialize on load
        window.onload = function() {
            renderPresets('all');
            renderNav();
            updateDocView();
        };
    </script>
</body>
